openapi: 3.0.3
info:
  title: Country Distance Guessing Game API
  version: 1.0.0
  description: |
    REST API for the Country Distance Guessing Game (web + Flutter mobile).
    The server secretly picks a country; the player searches for countries and
    guesses, and the server answers each guess with a distance range.

    This spec documents the two endpoints demonstrated in the SwaggerHub demo:

    1. `POST /api/auth/login`: log in with a verified account and get a JWT.
    2. `GET /api/countries/search`: server-side, case-insensitive partial-match search.

    **Authorization:** search needs a JWT. Call `POST /api/auth/login`, copy the
    `accessToken`, click **Authorize** and paste it. The token expires after 24 hours.
    The other endpoints (register, verify-email, password reset, games, guesses,
    leaderboard) are described in `docs/api-contract.md`.
servers:
  - url: https://cop4331-countryguesser.com
    description: Production (DigitalOcean, nginx + pm2)
  - url: http://localhost:5000
    description: Local development
tags:
  - name: Auth
  - name: Countries
paths:
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in and obtain a JWT
      description: |
        Log in with a verified account, copy the returned `accessToken`, then
        click **Authorize** and paste it to call the search endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: demo@example.com
              password: your-password
      responses:
        '200':
          description: Login succeeded. The token expires after 24 hours.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid email or password
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid email or password
        '403':
          description: The account email has not been verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Account email is not verified
        '429':
          description: Too many authentication requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/countries/search:
    get:
      tags: [Countries]
      operationId: searchCountries
      summary: Search countries by partial name
      description: |
        Returns countries whose name contains the query anywhere, ignoring case,
        so `fra` finds France and `afric` finds Central African Republic. The match
        runs on the server on every request, and regex characters in `q` are matched
        literally. Results are capped at `limit`.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Part of a country name (case-insensitive).
          schema:
            type: string
            minLength: 1
          example: fra
        - name: limit
          in: query
          required: false
          description: Maximum number of results (1 to 50).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Matching countries. An empty array means nothing matched.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
              examples:
                partialMatch:
                  summary: q=fra
                  value:
                    - id: 6aed5e40d455f880d20e4667
                      name: France
                      iso2: FR
                      iso3: FR
                      continent: ''
                noMatch:
                  summary: q=atlantis
                  value: []
        '400':
          description: The `q` parameter is missing or empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Search query parameter "q" is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Missing, malformed, tampered or expired access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Invalid or expired access token
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Internal server error
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
    LoginResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          description: JWT bearer token, valid for 24 hours.
        user:
          $ref: '#/components/schemas/AuthUser'
    AuthUser:
      type: object
      required: [id, firstName, lastName, email, totalPoints]
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        totalPoints:
          type: integer
          minimum: 0
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable message.
    Country:
      type: object
      required: [id, name, iso2, iso3, continent]
      properties:
        id:
          type: string
          description: Use this as `countryId` when guessing.
        name:
          type: string
        iso2:
          type: string
        iso3:
          type: string
        continent:
          type: string
